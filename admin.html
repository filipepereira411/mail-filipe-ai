<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Painel de Administração</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 20px; }
        .container { max-width: 800px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007BFF; color: white; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-edit { background: #ffc107; color: black; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gestão de Contas de Correio</h2>
        <p>Bem-vindo ao painel de controlo do administrador.</p>
        
        <table>
            <thead>
                <tr>
                    <th>Utilizador (E-mail)</th>
                    <th>Estado</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>utilizador1@teusite.com</td>
                    <td>Ativo</td>
                    <td>
                        <button class="btn btn-edit">Alterar Senha</button>
                        <button class="btn btn-delete">Bloquear</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
